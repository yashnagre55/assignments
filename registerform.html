<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register form</title>
</head>
<body>
    <h1><center>Registeration Form</center></h1>
    <hr>
    <form action="info">
        <label for="name">Name</label>
        <input type="text" id="name">
        <br>
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="example@something.com">
        <br>
        <label for="pass">Password</label>
        <input type="password" id="pass">
        <br>
        <label for="m">Male</label>
        <input id="m" type="radio" name="gender" value="male">
        <label for="fe">Female</label>
        <input id="fe" type="radio" name="gender" value="female">
        <br>
        <textarea name="hobbies" id="hob" rows="8" cols="30">Hobbies</textarea>
        <br>
        <button type="submit">submit</button>
    </form>
    <hr>
    <center><h1>...</h1></center>
    
</body>
</html>
